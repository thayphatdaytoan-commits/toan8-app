<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="pencilBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="helmet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- trail -->
  <path d="M40 180 Q90 140 160 100 T280 40" stroke="url(#pencilBody)" stroke-width="8" stroke-linecap="round" opacity="0.35" stroke-dasharray="12 10"/>
  <circle cx="52" cy="172" r="3" fill="#fde68a" opacity="0.9"/>
  <circle cx="78" cy="150" r="2" fill="#fff" opacity="0.7"/>
  <circle cx="120" cy="118" r="2.5" fill="#67e8f9" opacity="0.8"/>
  <!-- pencil rocket -->
  <g transform="rotate(-28 200 120)">
    <path d="M60 130 L220 90 L235 100 L75 165 Z" fill="url(#pencilBody)"/>
    <path d="M220 90 L250 75 L255 95 L235 100 Z" fill="#fbbf24"/>
    <path d="M250 75 L275 68 L278 88 L255 95 Z" fill="#f87171"/>
    <path d="M60 130 L45 145 L70 155 L75 165 Z" fill="#fcd34d"/>
    <path d="M45 145 L35 155 L65 162 L70 155 Z" fill="#1e293b"/>
  </g>
  <!-- astronaut -->
  <g transform="translate(175 38)">
    <ellipse cx="28" cy="18" rx="22" ry="20" fill="url(#helmet)" stroke="#6d28d9" stroke-width="2"/>
    <ellipse cx="28" cy="20" rx="14" ry="12" fill="#312e81"/>
    <circle cx="22" cy="18" r="4" fill="#93c5fd" opacity="0.5"/>
    <rect x="14" y="34" width="28" height="32" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    <rect x="8" y="42" width="10" height="18" rx="4" fill="#e2e8f0"/>
    <rect x="38" y="42" width="10" height="18" rx="4" fill="#e2e8f0"/>
    <ellipse cx="28" cy="72" rx="10" ry="6" fill="#cbd5e1"/>
    <path d="M18 8 L22 0 L34 0 L38 8" fill="#94a3b8"/>
  </g>
  <!-- small stars -->
  <g fill="#fde68a" opacity="0.85">
    <path d="M260 200l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>
    <path d="M30 60l1.5 4 4 1.5-4 1.5-1.5 4-1.5-4-4-1.5 4-1.5z" opacity="0.7"/>
    <path d="M290 120l1 3 3 1-3 1-1 3-1-3-3-1 3-1z"/>
  </g>
  <g fill="#67e8f9" opacity="0.5">
    <circle cx="200" cy="220" r="2"/>
    <circle cx="240" cy="200" r="1.5"/>
    <circle cx="100" cy="240" r="2"/>
  </g>
</svg>
