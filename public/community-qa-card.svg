<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" fill="none">
  <defs>
    <linearGradient id="qaBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8e4ff"/>
      <stop offset="55%" stop-color="#d6e4ff"/>
      <stop offset="100%" stop-color="#c7f0ff"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5b8cff"/>
      <stop offset="100%" stop-color="#3b6ef5"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" rx="28" fill="url(#qaBg)"/>
  <text x="72" y="92" font-family="Arial,sans-serif" font-size="72" font-weight="700" fill="#9db4ff" opacity=".35">?</text>
  <text x="510" y="120" font-family="Arial,sans-serif" font-size="56" font-weight="700" fill="#b8a6ff" opacity=".4">?</text>
  <text x="430" y="280" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#9ec5ff" opacity=".35">?</text>
  <!-- book on head -->
  <g transform="translate(250,48)">
    <ellipse cx="70" cy="250" rx="90" ry="18" fill="#9bb6e8" opacity=".35"/>
    <rect x="28" y="18" width="84" height="18" rx="4" fill="#f59e0b"/>
    <rect x="34" y="8" width="72" height="14" rx="3" fill="#fbbf24"/>
    <path d="M40 26h60v8H40z" fill="#d97706"/>
    <!-- head -->
    <circle cx="70" cy="78" r="42" fill="#f8c8a0"/>
    <path d="M35 70c8-28 62-34 72-8 4 10-2 18-10 20-14 4-28-2-40 2-12 4-20-2-22-14z" fill="#3f2a1e"/>
    <ellipse cx="56" cy="82" rx="4" ry="5" fill="#2d1b12"/>
    <ellipse cx="86" cy="82" rx="4" ry="5" fill="#2d1b12"/>
    <path d="M62 98c6 6 14 6 20 0" stroke="#c47a5a" stroke-width="3" stroke-linecap="round"/>
    <!-- body -->
    <path d="M38 125c8 48 56 52 68 8l8 90H30l8-98z" fill="#6ee7b7"/>
    <path d="M48 140c10 8 36 10 48 0" fill="#34d399"/>
    <!-- chin think -->
    <circle cx="118" cy="108" r="10" fill="#f8c8a0"/>
    <path d="M108 100c8 4 14 12 12 20" stroke="#f8c8a0" stroke-width="12" stroke-linecap="round"/>
  </g>
  <!-- question bubble -->
  <g transform="translate(88,120)">
    <rect x="0" y="0" width="110" height="88" rx="22" fill="url(#bubble)"/>
    <path d="M36 88l-8 22 28-14z" fill="#3b6ef5"/>
    <text x="55" y="62" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="800" fill="#fff">?</text>
  </g>
  <!-- open book -->
  <g transform="translate(430,200)">
    <path d="M0 40c30-28 70-28 100 0v48c-30-20-70-20-100 0V40z" fill="#fff" stroke="#94a3b8" stroke-width="3"/>
    <path d="M50 18v70" stroke="#cbd5e1" stroke-width="3"/>
    <path d="M18 48h24M18 60h20M62 48h24M62 60h20" stroke="#93c5fd" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- avatar chip -->
  <g transform="translate(500,70)">
    <circle cx="36" cy="36" r="34" fill="#fff" stroke="#c4b5fd" stroke-width="4"/>
    <circle cx="36" cy="28" r="14" fill="#fcd34d"/>
    <path d="M14 58c6-14 38-14 44 0" fill="#60a5fa"/>
