  </defs>
  <rect width="640" height="360" rx="28" fill="url(#ctBg)"/>
  <ellipse cx="120" cy="80" rx="70" ry="28" fill="#fff" opacity=".55"/>
  <ellipse cx="520" cy="60" rx="90" ry="32" fill="#fff" opacity=".45"/>
  <ellipse cx="560" cy="300" rx="80" ry="26" fill="#fff" opacity=".4"/>
