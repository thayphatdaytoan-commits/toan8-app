<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/mathedu-logo.png" />
    <link rel="apple-touch-icon" href="/mathedu-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        try {
          if (!/^\/bai-giang\//i.test(location.pathname || '')) return;
          var root = document.getElementById('root');
          if (!root) return;
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;color:#475569;background:#f1f5f9">' +
            '<div style="text-align:center;padding:2rem">' +
            '<div style="width:44px;height:44px;border:4px solid #99f6e4;border-top-color:#0d9488;border-radius:50%;animation:dlspin .8s linear infinite;margin:0 auto 1rem"></div>' +
            '<p style="font-weight:700;color:#1e293b;margin:0 0 .35rem">Đang mở bài giảng…</p>' +
            '<p style="font-size:14px;margin:0;color:#64748b">Vui lòng đợi trong giây lát</p></div></div>' +
            '<style>@keyframes dlspin{to{transform:rotate(360deg)}}</style>';
        } catch (e) { /* ignore */ }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
